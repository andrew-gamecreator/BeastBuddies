<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Beast Buddies Academy</title>
<style>
/* ============================================================
   BEAST BUDDIES ACADEMY - styles
   Big buttons, high contrast, bright but calm colors.
   ============================================================ */
:root{
  --ink:#1b2a4e; --ink2:#3a4a78;
  --sky1:#9fe3ff; --sky2:#e6f8ff;
  --sun:#ffd23f; --sun-d:#d9a400;
  --coral:#ff6f61; --coral-d:#c9453a;
  --leaf:#47c86a; --leaf-d:#259446;
  --grape:#8b5cf6; --grape-d:#5b34c4;
  --ocean:#2aa7e6; --ocean-d:#127bb3;
  --white:#ffffff; --card:#fffdf4;
  --font:'Andika','Century Gothic','Trebuchet MS','Comic Sans MS','Chalkboard SE',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%)}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  overflow-y:auto;overflow-x:hidden;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
svg{display:block}
.art{width:100%;height:100%}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:980px;gap:10px;flex:0 0 auto;min-height:66px}
.topbar .mid{flex:1;text-align:center;font-weight:800;font-size:clamp(18px,3.4vw,30px)}
.round{width:64px;height:64px;border-radius:50%;border:0;background:var(--white);color:var(--ink);
  box-shadow:0 5px 0 rgba(27,42,78,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:12px;flex:0 0 auto}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(27,42,78,.25)}
.round svg{width:100%;height:100%}

/* ---------- buttons ---------- */
.btn{min-height:84px;min-width:120px;border:0;border-radius:26px;font:800 clamp(24px,4.4vw,38px) var(--font);color:#fff;
  padding:12px 30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  background:var(--leaf);box-shadow:0 7px 0 var(--leaf-d);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--leaf-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 7px 0 var(--sun-d)}
.btn.grape{background:var(--grape);box-shadow:0 7px 0 var(--grape-d)}
.btn.ocean{background:var(--ocean);box-shadow:0 7px 0 var(--ocean-d)}
.btn.coral{background:var(--coral);box-shadow:0 7px 0 var(--coral-d)}
.btn.plain{background:var(--white);color:var(--ink);box-shadow:0 7px 0 rgba(27,42,78,.25)}
.btn svg{width:46px;height:46px;flex:0 0 auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.hear{min-height:84px;min-width:84px;padding:10px 26px}

/* ---------- guide + speech bubble ---------- */
.guide-row{display:flex;align-items:center;gap:14px;width:100%;max-width:900px;margin:6px 0}
.guide{width:clamp(90px,18vw,150px);height:clamp(90px,18vw,150px);flex:0 0 auto}
.guide.talk .mouth{animation:talk .28s infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.2)}}
.mouth{transform-box:fill-box;transform-origin:center}
.bubble{position:relative;background:var(--white);border-radius:28px;padding:16px 22px;font-weight:800;
  font-size:clamp(22px,4.2vw,36px);line-height:1.25;box-shadow:0 5px 0 rgba(27,42,78,.18);flex:1}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-14px;border:14px solid transparent;border-left:0;border-right-color:var(--white)}

/* ---------- question panel ---------- */
.qwrap{width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1 0 auto}
.qshow{background:var(--card);border-radius:30px;box-shadow:0 6px 0 rgba(27,42,78,.15);padding:14px;width:100%;
  display:flex;align-items:center;justify-content:center;min-height:150px;gap:14px;flex-wrap:wrap}
.qshow .big{font-size:clamp(64px,16vw,130px);font-weight:900;line-height:1;color:var(--ink)}
.qshow .word{font-size:clamp(48px,11vw,96px);font-weight:900;letter-spacing:.04em}
.qshow .sent{font-size:clamp(34px,7vw,64px);font-weight:900;text-align:center;line-height:1.2}
.qshow .pic{width:clamp(90px,22vw,170px);height:clamp(90px,22vw,170px)}
.qshow .row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qshow .opsym{font-size:clamp(48px,10vw,90px);font-weight:900;color:var(--grape)}
.gap{display:inline-block;min-width:1.4em;border-bottom:8px solid var(--coral);text-align:center;color:var(--coral)}
.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}
.choice{min-height:96px;min-width:110px;flex:1 1 130px;max-width:230px;border:0;border-radius:28px;background:var(--white);
  color:var(--ink);box-shadow:0 7px 0 rgba(27,42,78,.28);font:900 clamp(40px,9vw,72px) var(--font);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:8px}
.choice.pic{min-height:120px}
.choice.pic .pic{width:clamp(80px,17vw,130px);height:clamp(80px,17vw,130px)}
.choice.txt{font-size:clamp(34px,8vw,60px)}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(27,42,78,.28)}
.choice.good{background:var(--leaf);color:#fff;animation:pop .45s}
.choice.try{background:#ffe9a8;animation:wobble .5s}
.choice.dim{opacity:.25;pointer-events:none}
.choice.sel{background:#d9ccff}
.spinfx{animation:spinfx .8s}
@keyframes spinfx{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(55%) rotate(360deg) scale(1.1)}100%{transform:translateX(0) rotate(720deg)}}
.jumpfx{animation:jumpfx .8s}
@keyframes jumpfx{0%{transform:translate(0,0)}40%{transform:translate(50%,-60px) scale(1.1)}100%{transform:translate(0,0)}}
.choice.glow{outline:8px solid var(--sun);animation:pulse .8s infinite alternate}
.choice[disabled]{pointer-events:none}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.dots{display:flex;gap:10px;justify-content:center}
.dot{width:22px;height:22px;border-radius:50%;background:rgba(27,42,78,.2)}
.dot.on{background:var(--sun);box-shadow:0 0 0 4px var(--ink2) inset}
.dot.done{background:var(--leaf)}

/* ---------- start / profiles ---------- */
.title-logo{font-size:clamp(40px,9vw,84px);font-weight:900;text-align:center;line-height:1;color:var(--ink);
  text-shadow:0 5px 0 #fff;margin:6px 0}
.title-logo span{color:var(--grape)}
.profiles{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin:14px 0;width:100%;max-width:900px}
.pcard{width:clamp(130px,26vw,190px);background:var(--card);border-radius:30px;padding:12px;text-align:center;
  box-shadow:0 7px 0 rgba(27,42,78,.2);cursor:pointer;border:0;font:800 clamp(20px,4vw,30px) var(--font);color:var(--ink)}
.pcard:active{transform:translateY(5px)}
.pcard .av{width:100%;aspect-ratio:1}
.avatars{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.avbtn{width:clamp(100px,21vw,150px);aspect-ratio:1;border:6px solid transparent;border-radius:28px;background:var(--card);
  box-shadow:0 6px 0 rgba(27,42,78,.2);padding:6px;cursor:pointer}
.avbtn.sel{border-color:var(--grape);background:#efe6ff}
.field{font:800 clamp(24px,5vw,40px) var(--font);padding:14px 20px;border-radius:22px;border:4px solid var(--ink2);
  width:min(92vw,520px);text-align:center;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.note{font-size:clamp(16px,2.6vw,22px);font-weight:700;color:var(--ink2);text-align:center;max-width:700px}

/* ---------- map ---------- */
.mapwrap{position:relative;width:100%;max-width:980px;flex:1 0 auto;padding-bottom:30px}
.map{position:relative;border-radius:34px;padding:20px 10px 30px;background:
  radial-gradient(circle at 15% 10%,#d9f7c4 0 18%,transparent 19%),
  radial-gradient(circle at 85% 40%,#c9efff 0 16%,transparent 17%),
  radial-gradient(circle at 20% 75%,#ffe9b0 0 18%,transparent 19%),
  linear-gradient(180deg,#bff0a8,#8fdc9a);box-shadow:0 8px 0 rgba(27,42,78,.2)}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 12px;justify-items:center}
.node{width:112px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;font-family:var(--font)}
.node .disc{width:96px;height:96px;border-radius:50%;background:var(--sun);box-shadow:0 7px 0 var(--sun-d);display:flex;
  align-items:center;justify-content:center;border:5px solid #fff;position:relative}
.node.num .disc{background:var(--ocean);box-shadow:0 7px 0 var(--ocean-d)}
.node.lit .disc{background:var(--coral);box-shadow:0 7px 0 var(--coral-d)}
.node.locked .disc{background:#b8c0d4;box-shadow:0 7px 0 #8a93ad;opacity:.8}
.node.done .disc{background:var(--leaf);box-shadow:0 7px 0 var(--leaf-d)}
.node.next .disc{animation:pulse .8s infinite alternate}
.node .disc svg{width:60px;height:60px}
.node .ttl{font-weight:800;font-size:16px;line-height:1.1;background:#fff;border-radius:12px;padding:3px 8px;max-width:118px;text-align:center}
.node .stars{display:flex;gap:2px;height:22px}
.node .stars svg{width:22px;height:22px}
.mapfoot{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* ---------- battle ---------- */
.arena{width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;position:relative;
  background:linear-gradient(180deg,#bfeaff,#e9fbff 55%,#a8e6a0 55%,#7fd18a);border-radius:30px;padding:10px;
  box-shadow:0 6px 0 rgba(27,42,78,.2);flex:0 0 auto}
.fighter{position:relative;display:flex;flex-direction:column;align-items:center}
.fighter .fig{width:clamp(100px,24vw,220px);height:clamp(100px,24vw,220px)}
.hpbar{width:100%;max-width:260px;height:28px;border-radius:16px;background:#fff;border:4px solid var(--ink);overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:var(--leaf);transition:width .6s}
.hpbar.boss i{background:var(--coral)}
.hpbar.low i{background:var(--sun)}
.fname{font-weight:900;font-size:clamp(16px,3vw,24px);margin-bottom:4px;background:#fff;border-radius:14px;padding:2px 12px}
.float{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(30px,6vw,56px);color:var(--coral-d);
  text-shadow:0 3px 0 #fff;animation:floatup 1.1s forwards;pointer-events:none;white-space:nowrap;z-index:4}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.lunge-r{animation:lunger .7s}
.lunge-l{animation:lungel .7s}
@keyframes lunger{0%{transform:translateX(0)}40%{transform:translateX(60%) scale(1.1)}100%{transform:translateX(0)}}
@keyframes lungel{0%{transform:translateX(0)}40%{transform:translateX(-60%) scale(1.1)}100%{transform:translateX(0)}}
.hit{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.stumble{animation:stumble .9s}
@keyframes stumble{0%{transform:rotate(0)}30%{transform:rotate(-14deg) translateY(10px)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.nap .fig{animation:napdip 1s forwards}
@keyframes napdip{to{transform:rotate(-12deg) translateY(14px);opacity:.85}}
.shield{position:absolute;inset:6% 6%;border-radius:50%;border:10px solid rgba(42,167,230,.7);background:rgba(42,167,230,.2);animation:pop .6s;z-index:3}
.moves{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:900px}
.move{flex:1 1 170px;max-width:290px}
.banner{font-weight:900;font-size:clamp(26px,5vw,44px);text-align:center;background:#fff;border-radius:24px;padding:10px 22px;
  box-shadow:0 5px 0 rgba(27,42,78,.18)}
.power{display:inline-block;background:var(--grape);color:#fff;border-radius:14px;padding:2px 12px;font-size:clamp(14px,2.4vw,20px);font-weight:800}
.glowfx{filter:drop-shadow(0 0 10px #ffe066) drop-shadow(0 0 22px #ffd23f)}

/* ---------- celebration ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-30px;width:16px;height:24px;border-radius:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.bigstar{width:clamp(90px,22vw,150px);height:clamp(90px,22vw,150px);animation:pop .7s both}
.starrow{display:flex;gap:10px;justify-content:center}

/* ---------- sticker book ---------- */
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;width:100%;max-width:960px;
  background:var(--card);border-radius:30px;padding:16px;box-shadow:0 6px 0 rgba(27,42,78,.15)}
.slot{aspect-ratio:1;border-radius:24px;background:#e8ecf6;display:flex;align-items:center;justify-content:center;padding:8px;border:4px dashed #b8c0d4}
.slot.got{background:#fff;border:4px solid var(--sun)}
.slot svg{width:100%;height:100%}

/* ---------- parent area ---------- */
.parent{align-items:stretch;font-size:18px}
.parent .inner{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:#fff;border-radius:22px;padding:16px 20px;box-shadow:0 4px 0 rgba(27,42,78,.15)}
.panel h2{margin:0 0 8px;font-size:22px}
.panel h3{margin:10px 0 4px;font-size:18px}
.meter{height:20px;border-radius:10px;background:#e6eaf5;overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--ocean)}
.prow{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.parent .btn{min-height:64px;font-size:20px;padding:8px 20px}
.parent input[type=range]{width:100%;height:36px}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.cornerbtn{position:fixed;left:0;bottom:0;width:56px;height:56px;border:0;background:transparent;z-index:30;opacity:.35;padding:0}
.cornerbtn i{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:var(--ink2);opacity:.35}
.cornerbtn.holding i{opacity:.9;animation:pulse .5s infinite alternate}
.hidden{display:none!important}

#panel .qshow{min-height:96px;padding:8px}
#panel .qwrap{gap:8px}
#panel .banner{font-size:clamp(22px,4vw,34px);padding:6px 18px}
.arena .fighter .fig{width:clamp(80px,min(22vw,28vh),200px);height:clamp(80px,min(22vw,28vh),200px)}

/* ---------- pretest trail ---------- */
.trail{display:flex;gap:10px;justify-content:center;margin:2px 0 6px;flex:0 0 auto}
.stone{width:44px;height:30px;border-radius:50%;background:rgba(255,255,255,.7);border:3px solid #fff;box-shadow:0 3px 0 rgba(27,42,78,.18);display:flex;align-items:center;justify-content:center;transition:background .3s}
.stone.on{background:var(--sun)}
.stone svg{width:20px;height:20px}
.stone.on svg path,.stone.on svg ellipse,.stone.on svg circle{fill:#1b2a4e}
.fighter .fig > svg{animation:idle 2.4s ease-in-out infinite}
.nap .fig > svg{animation:none}
.defeat .fig{animation:defeat 1.1s forwards}
@keyframes defeat{0%{transform:rotate(0)}40%{transform:rotate(18deg) scale(1.05)}100%{transform:rotate(60deg) translateY(40px) scale(.3);opacity:0}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.burst{position:absolute;left:50%;top:40%;width:90px;height:90px;margin:-45px 0 0 -45px;pointer-events:none;z-index:5;animation:burst .6s ease-out forwards}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.qshow{cursor:pointer}
select.field{font-size:20px;padding:10px;width:100%;max-width:520px}
/* ---------- small screens ---------- */
@media (max-height:480px){
  .round{width:52px;height:52px;padding:9px}
  .topbar{min-height:54px}
  .qshow{min-height:100px;padding:8px}
  .qshow .big{font-size:64px}
  .choice{min-height:84px}
  .guide{width:76px;height:76px}
}
@media (orientation:portrait) and (max-width:520px){
  .arena .fighter .fig{width:36vw;height:36vw}
  .choice{flex:1 1 90px;min-width:90px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

<body>
<div id="app"></div>
<button id="corner" class="cornerbtn" aria-label="grown-ups"><i></i></button>
<script>
"use strict";
/* ============================================================
   SECTION 1: CORE UTILITIES, STORAGE, SOUND, VOICE
   ============================================================ */
let timeScale = 1;                       // tests set this small to run fast
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const between = (lo, hi) => lo + rnd(hi - lo + 1);
const sleep = ms => new Promise(r => setTimeout(r, ms * timeScale));
const uid = () => Math.random().toString(36).slice(2, 9);
const NUMWORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const Store = {
  key: 'beast_buddies_academy_v1',
  data: null,
  mem: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.key); } catch (e) { raw = this.mem; }
    try { this.data = raw ? JSON.parse(raw) : null; } catch (e) { this.data = null; }
    if (!this.data || !Array.isArray(this.data.profiles)) {
      this.data = { profiles: [], activeId: null, settings: { muted: false, volume: 0.9, rate: 0.85, pitch: 1.1, voiceName: '' } };
    }
    this.data.settings = Object.assign({ muted: false, volume: 0.9, rate: 0.85, pitch: 1.1, voiceName: '' }, this.data.settings || {});
  },
  save() {
    const s = JSON.stringify(this.data);
    try { localStorage.setItem(this.key, s); } catch (e) { this.mem = s; }
  },
  get settings() { return this.data.settings; },
  get profile() { return this.data.profiles.find(p => p.id === this.data.activeId) || null; }
};

/* ---------- sound effects (Web Audio, no files) ---------- */
const Sfx = {
  ctx: null,
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* no audio available */ }
  },
  tone(freq, start, dur, type, vol, slideTo) {
    if (!this.ctx || Store.settings.muted) return;
    const c = this.ctx, t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const v = (vol || 0.25) * Store.settings.volume;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  play(name) {
    this.unlock();
    const T = (f, s, d, ty, v, sl) => this.tone(f, s, d, ty, v, sl);
    switch (name) {
      case 'tap': T(520, 0, .08, 'sine', .2); break;
      case 'ok': T(523, 0, .12, 'triangle'); T(659, .1, .12, 'triangle'); T(784, .2, .2, 'triangle'); break;
      case 'soft': T(330, 0, .18, 'sine', .18, 260); break;           // gentle "almost" boop
      case 'whoosh': T(300, 0, .3, 'sawtooth', .08, 900); break;
      case 'hit': T(220, 0, .18, 'square', .18, 80); T(440, .05, .15, 'triangle', .15, 180); break;
      case 'bonk': T(160, 0, .2, 'sine', .3, 90); break;

const Art = {
  pic: (name, color) => svgWrap(PICS[name](color && PIC_COLORS[color] ? PIC_COLORS[color] : color), '0 0 100 100', 'art'),
  picBox: (name, color) => '<div class="pic">' + Art.pic(name, color) + '</div>',
  shape: (name, color) => svgWrap(SHAPES[name](PIC_COLORS[color] || color || '#8b5cf6'), '0 0 100 100', 'art'),
  icon: (name, c) => svgWrap(ICONS[name](c), '0 0 100 100', 'art'),
  /* a grid of n counting items; opts.cross = how many to cross out; opts.aid = number each item */
  items(kind, n, opts) {
    opts = opts || {};
    const cols = opts.cols || (n <= 5 ? n : 5);
    const size = opts.size || (n > 10 ? 46 : 58);
    const rows = Math.ceil(n / cols);
    const W = cols * (size + 8) + 8, H = rows * (size + (opts.aid ? 22 : 8)) + 8;
    let g = '';
    for (let i = 0; i < n; i++) {
      const x = 8 + (i % cols) * (size + 8), y = 8 + Math.floor(i / cols) * (size + (opts.aid ? 22 : 8));
      g += '<svg x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" viewBox="0 0 100 100">' + COUNT_ITEMS[kind]() + '</svg>';
      if (opts.cross && i >= n - opts.cross) g += '<path d="M' + (x + 4) + ' ' + (y + 4) + ' L' + (x + size - 4) + ' ' + (y + size - 4) + ' M' + (x + size - 4) + ' ' + (y + 4) + ' L' + (x + 4) + ' ' + (y + size - 4) + '" stroke="#e84a5f" stroke-width="7" stroke-linecap="round"/>';
      if (opts.aid) g += '<text x="' + (x + size / 2) + '" y="' + (y + size + 16) + '" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="' + INK + '">' + (i + 1) + '</text>';
    }
    const maxw = Math.min(W * (n > 10 ? 1.0 : 1.1), 520);

  }
};

/* ---------- helpers ---------- */

const QMARK = '<div class="big">?</div>';
/* numeric choices: the answer plus near neighbours, all inside [lo, hi] */
function numChoices(ans, lo, hi, n) {
  const pool = [];
  for (let v = lo; v <= hi; v++) if (v !== ans) pool.push(v);
  pool.sort((a, b) => Math.abs(a - ans) - Math.abs(b - ans) + (Math.random() - .5) * 1.6);
  const out = [ans].concat(pool.slice(0, Math.max(1, n - 1)));
  return shuffle(out).map(v => txtC(v));
}
const spokenCount = n => NUMWORD[n] || String(n);
function countingWords(n) { const a = []; for (let i = 1; i <= n; i++) a.push(NUMWORD[i]); return a.join(', '); }

});

addSkill('pattern', {
  cat: 'counting', domain: 'num',
  gen(args, tier) {
    const cols = sample(['red', 'blue', 'green', 'yellow', 'purple', 'orange'], 3);
    const shapes = sample(['circle', 'square', 'triangle', 'star'], 2);
    const kinds = tier === 0 ? ['AB'] : (tier === 1 ? ['AB', 'AAB', 'ABB'] : ['AB', 'AAB', 'ABB', 'ABC']);
    const kind = pick(kinds), unit = kind.split('');
    const useShape = Math.random() < 0.4;
    const el = ch => ({ c: cols['ABC'.indexOf(ch)], s: useShape ? shapes['ABC'.indexOf(ch) % 2] : 'circle' });
    const seq = []; const reps = 3;
    for (let r = 0; r < reps; r++) unit.forEach(ch => seq.push(el(ch)));
    const cut = unit.length * 2 + (kind === 'ABC' ? 0 : 0);
    const shown = seq.slice(0, cut + (unit.length > 2 ? 1 : 1) - 1);
    const next = seq[shown.length];
    const key = o => o.s + ':' + o.c;
    const pool = ['A', 'B', 'C'].map(ch => el(ch)).filter(o => key(o) !== key(next));
    const offs = sample(pool, nCh(tier) - 1);
    while (offs.length < nCh(tier) - 1) offs.push({ c: pick(SHAPE_COLORS.filter(c => c !== next.c)), s: next.s });
    const html = '<div class="row">' + shown.map(o => '<div class="pic" style="width:64px;height:64px">' + Art.shape(o.s, o.c) + '</div>').join('') + '<div class="gap" style="width:64px">&nbsp;</div></div>';
    const uniqW = []; const seenK = {}; seenK[key(next)] = 1;
    offs.forEach(w => { if (!seenK[key(w)]) { seenK[key(w)] = 1; uniqW.push(w); } });
    while (uniqW.length < nCh(tier) - 1) { const w = { c: pick(SHAPE_COLORS), s: pick(['circle', 'square', 'triangle', 'star']) }; if (!seenK[key(w)]) { seenK[key(w)] = 1; uniqW.push(w); } }
    return { say: 'What comes next in the pattern?', show: html, choices: shuffle([next].concat(uniqW)).map(o => shapeC(o.s, o.c)), answer: next.s + ':' + next.c,
      hint: 'Look at the pattern. It goes over and over. Say it: ' + shown.map(o => (useShape ? o.s : o.c)).join(', ') + '.', explain: 'The pattern keeps going. Next is ' + (useShape ? next.s : next.c) + '.' };
  },
  teach() {
    const a = ['red', 'blue'], out = [];
    out.push({ html: '<div class="row">' + [0, 1, 0, 1, 0].map(i => '<div class="pic" style="width:70px;height:70px">' + Art.shape('circle', a[i]) + '</div>').join('') + '</div>', say: 'Red, blue, red, blue, red. This is a pattern. It repeats!' });
    out.push({ html: '<div class="row">' + ['green', 'green', 'yellow', 'green', 'green'].map(c => '<div class="pic" style="width:70px;height:70px">' + Art.shape('square', c) + '</div>').join('') + '</div>', say: 'Green, green, yellow, green, green. What comes next? Yellow! Patterns repeat.' });
    return out;
  }
});

/* ============================================================
   SECTION 6: ENGINE - profiles, adaptive difficulty, placement, questions
   ============================================================ */
const Engine = {
  newProfile(name, avatar) {
    const hy = {};
    HYBRIDS.forEach(h => { hy[h.id] = { unlocked: h.id === avatar, stars: 0 }; });
    return { id: uid(), name: name || 'Buddy', avatar: avatar, sel: avatar, placed: false,
      level: { lit: 1, num: 1 }, stretch: { lit: 1, num: 1 }, recent: { lit: [], num: [] },
      stats: {}, lessons: {}, hybrids: hy, stickers: [], naps: {}, created: Date.now() };
  },

  /* record one answered question and adapt difficulty gradually */
  record(p, q, correct) {
    const c = p.stats[q.cat] || (p.stats[q.cat] = { asked: 0, right: 0, recent: [] });
    c.asked++; if (correct) c.right++;
    c.recent.push(correct ? 1 : 0); if (c.recent.length > 12) c.recent.shift();
    const r = p.recent[q.domain];
    r.push(correct ? 1 : 0); if (r.length > 10) r.shift();
    const n = r.length, acc = r.reduce((a, b) => a + b, 0) / n;
    if (n >= 8 && acc >= 0.8 && p.stretch[q.domain] < 2) { p.stretch[q.domain]++; p.recent[q.domain] = []; }
    else if (n >= 6 && acc < 0.5 && p.stretch[q.domain] > 0) { p.stretch[q.domain]--; p.recent[q.domain] = []; }
  },
  tier(p, domain) { return p.stretch[domain]; },

  /* turn pretest results into starting levels (1 to 4).
     A tier is passed when about 60 percent of its items are right (one item must simply be right),
     so a single lucky guess cannot jump a child far ahead. Levels are reached one after another. */
  place(results) {
    const out = {};
    ['lit', 'num'].forEach(d => {
      let level = 1;
      for (let t = 1; t <= 4; t++) {
        const asked = results[d].filter(r => r.t === t);
        if (!asked.length) break;
        const right = asked.filter(r => r.ok).length;
        const need = asked.length === 1 ? 1 : Math.ceil(asked.length * 0.6);
        if (right >= need) level = t; else break;
      }
      out[d] = level;
    });
    return out;
  },

  /* lessons: index of the first lesson at the child's level */
  startIndex(p, domain) {
    const list = LESSONS_OF(domain);
    const i = list.findIndex(l => l.level >= p.level[domain]);
    return i < 0 ? list.length - 1 : i;
  },
  isDone(p, id) { return !!(p.lessons[id] && p.lessons[id].done); },
  isOpen(p, id) {
    const l = LESSON(id), list = LESSONS_OF(l.domain), i = list.findIndex(x => x.id === id), s = Engine.startIndex(p, l.domain);
    if (i <= s) return true;
    return Engine.isDone(p, list[i - 1].id);
  },
  /* the lesson the map should point at for each area */
  nextLesson(p, domain) {
    const list = LESSONS_OF(domain);
    for (let i = Engine.startIndex(p, domain); i < list.length; i++) if (!Engine.isDone(p, list[i].id)) return list[i];
    return null;
  },
  completeLesson(p, id) {
    const l = LESSON(id), cur = p.lessons[id] || (p.lessons[id] = { done: false, stars: 0, won: false });
    cur.done = true;
    const sameLevel = LESSONS_OF(l.domain).filter(x => x.level === p.level[l.domain]);
    if (sameLevel.length && sameLevel.every(x => Engine.isDone(p, x.id)) && p.level[l.domain] < 4) { p.level[l.domain]++; p.stretch[l.domain] = 1; p.recent[l.domain] = []; }
    else {
      const r = p.recent[l.domain];
      if (r.length >= 5 && p.stretch[l.domain] === 2 && p.level[l.domain] < 4 && r.reduce((a, b) => a + b, 0) / r.length >= 0.8) { p.level[l.domain]++; p.stretch[l.domain] = 1; p.recent[l.domain] = []; }
    }
  },

  /* ----- questions ----- */
  make(skillId, args, p, domainOverride) {
    const sk = SKILLS[skillId];
    const tier = p ? Engine.tier(p, sk.domain) : 1;
    const q = sk.gen(args || {}, tier);
    q.skill = skillId; q.domain = sk.domain; q.cat = sk.cat; q.tier = tier;
    return q;
  },
  /* make a question not equal to the previous one (by its spoken prompt + answer) */
  makeFresh(skillId, args, p, prevKeys) {
    let q = null;
    for (let i = 0; i < 12; i++) { q = Engine.make(skillId, args, p); if (!prevKeys || !prevKeys.includes(q.say + '|' + q.answer)) break; }
    return q;
  },
  practiceSet(lesson, p, n) {
    const out = [], keys = [];
    for (let i = 0; i < n; i++) {
      const [sid, args] = lesson.pool[i % lesson.pool.length];
      const q = Engine.makeFresh(sid, args, p, keys);
      keys.push(q.say + '|' + q.answer); out.push(q);
    }
    return out;
  },
  /* battle question for an area: learned lessons count, newest lesson counts triple */
  battleQuestion(p, domain, lessonId, prevKeys) {
    const cur = LESSON(lessonId);
    let pool = LESSONS_OF(domain).filter(l => Engine.isDone(p, l.id) || l.id === lessonId);
    if (!pool.length) pool = [LESSONS_OF(domain)[Engine.startIndex(p, domain)]];
    const weighted = [];
    pool.forEach(l => { const w = l.id === lessonId ? 3 : 1; for (let i = 0; i < w; i++) weighted.push(l); });
    const l = pick(weighted);
    const [sid, args] = pick(l.pool);
    return Engine.makeFresh(sid, args, p, prevKeys);
  }
};

/* ============================================================
   QUESTION PRESENTER
   Shows a question inside `host` and resolves {ok, first, tries}.
   modes:
     pretest  - no hints, no retry, nothing shown about right or not
     practice - gentle hint then one more try, then the guide shows the answer
   options: retries, removeOne (hide one choice at the start), getRetry() (extra free try), fb ('full' | 'short')
   ============================================================ */
function presentQuestion(host, q, o) {
  o = Object.assign({ mode: 'practice', retries: 1, fb: 'full', removeOne: false, getRetry: null, say: true }, o || {});
  const tok = App.token;
  App.q = q;                                   // current question (handy for tests)
  return new Promise(resolve => {
    const st = { tries: 0, done: false, retriesLeft: o.retries };
    host.innerHTML = '<div class="qwrap">' + (o.banner ? '<div class="banner">' + o.banner + '</div>' : '') + '<div class="qshow">' + q.show + '</div><div class="choices">' +
      q.choices.map((c, i) => '<button class="choice ' + (c.cls || '') + '" data-i="' + i + '">' + c.html + '</button>').join('') +
      '</div><div>' + hearBtn() + '</div></div>';
    wireTop(host);
    $('.qshow', host).addEventListener('click', () => { Voice.again(); });   // tap the picture to hear it again
    const btns = $$('.choice', host);
    const correctIdx = q.choices.findIndex(c => c.val === q.answer);
    const live = () => btns.filter(b => !b.classList.contains('dim'));
    const removeOne = () => {
      const cands = btns.filter((b, i) => i !== correctIdx && !b.classList.contains('dim'));
      if (live().length > 2 && cands.length) pick(cands).classList.add('dim');
    };
    if (o.removeOne) removeOne();
    if (o.say) Voice.say(q.say);
    else Voice.last = q.say;
    const finish = (res, delay) => { st.done = true; setTimeout(() => { if (tok === App.token) resolve(res); }, delay * timeScale); };
    btns.forEach((b, i) => b.addEventListener('click', () => {
      Sfx.unlock();
      if (st.done || b.classList.contains('dim')) return;
      const ok = i === correctIdx;
      if (o.mode === 'pretest') {
        Sfx.play('tap'); b.classList.add('good'); btns.forEach(x => x.disabled = true);
        finish({ ok: ok, first: ok, tries: 1 }, 650); return;
      }
      if (ok) {
        Sfx.play('ok'); b.classList.add('good'); btns.forEach(x => { x.disabled = true; });
        const praise = (Math.random() < 0.25 && prof() ? pick(PRAISE).replace(/!$/, '') + ', ' + prof().name + '!' : pick(PRAISE));
        if (o.fb === 'full') {
          setBubble(praise);
          Voice.say(praise + ' ' + (q.explain || ''), { noRemember: true, mood: 'cheer' }).then(() => finish({ ok: true, first: st.tries === 0, tries: st.tries + 1 }, 350));
          st.done = true;
        } else { Voice.say(praise, { noRemember: true, mood: 'cheer' }); finish({ ok: true, first: st.tries === 0, tries: st.tries + 1 }, 800); }
        return;
      }
      /* a miss: gentle, never punishing */
      st.tries++;
      Sfx.play('soft'); b.classList.add('try');
      setTimeout(() => { b.classList.remove('try'); b.classList.add('dim'); }, 520 * timeScale);
      let canRetry = st.retriesLeft > 0;
      if (canRetry) st.retriesLeft--;
      else if (o.getRetry && o.getRetry()) canRetry = true;
      if (canRetry) {
        const line = pick(TRY_AGAIN);
        setBubble(line);
        Voice.say(line + ' ' + q.hint, { noRemember: true, mood: 'hint' });
        if (q.tier === 0 || o.removeOne) setTimeout(removeOne, 650 * timeScale);
        return;
      }
      /* out of tries: the guide shows the answer, and the game moves on */
      st.done = true;
      btns.forEach(x => { x.disabled = true; });
      setTimeout(() => {
        if (tok !== App.token) return;
        btns[correctIdx].classList.remove('dim'); btns[correctIdx].classList.add('glow');
        const line = TRY_AGAIN[0];
        setBubble(line);
        Voice.say(line + ' ' + (q.explain || ''), { noRemember: true }).then(() => finish({ ok: false, first: false, tries: st.tries }, 500));
      }, 600 * timeScale);
    }));
  });
}

/* ---------- placement game (the pretest) ----------
   Feels like a game: Pip walks along a trail, a warm-up shows how to tap, then
   short questions get a little harder. Nothing says right or not, and no score is shown. */
Screens.pretest = function () {
  const p = prof();
  const { el, tok } = newScreen(topbar("Let's play!", { home: false }) + guideRow('') + '<div class="trail" id="trail"></div><div id="main" class="qwrap"></div>');
  const trail = $('#trail', el);
  const paintTrail = n => {
    let h = '';
    for (let i = 0; i < 8; i++) h += '<div class="stone ' + (i < n ? 'on' : '') + '">' + (i < n ? Art.icon('paw') : '') + '</div>';
    trail.innerHTML = h;
  };
  paintTrail(0);
  run(async () => {
    const main = $('#main', el);
    const intro = "Let's see what you already know so we can pick the best adventures!";
    setBubble('Hi ' + p.name + '!');
    main.innerHTML = '<div style="margin-top:14px"><button class="btn sun" id="st" style="min-height:110px;font-size:clamp(30px,6vw,48px)">' + Art.icon('arrow', '#1b2a4e') + ' Start</button></div>' + hearBtn();
    wireTop(main);
    Voice.say('Hi ' + p.name + '! ' + intro);
    await new Promise(r => $('#st', main).addEventListener('click', () => { Sfx.unlock(); Sfx.play('tap'); r(); }));
    guard(tok);

    /* warm-up: learn how to tap (not counted, extra friendly) */
    const warmChoices = shuffle([shapeC('circle', 'blue'), shapeC('star', 'yellow'), shapeC('heart', 'pink')]);
    const warm = { say: 'First, a tapping game. Tap the star!', show: '<div class="pic">' + Art.shape('star', 'yellow') + '</div>', choices: warmChoices, answer: 'star:yellow',
      hint: 'The star has pointy tips. Tap the star.', explain: 'You tapped the star!', skill: 'warmup', domain: 'num', cat: 'counting', tier: 1 };
    setBubble('Tap the star!');
    await presentQuestion(main, warm, { mode: 'practice', retries: 3, fb: 'full' });
    guard(tok);

    const results = { lit: [], num: [] }, idx = { lit: 0, num: 0 }, miss = { lit: 0, num: 0 }, stopped = { lit: false, num: false }, lastOk = { lit: true, num: true };
    let turn = 0, asked = 0;
    const lines = ['Tap the answer!', 'You choose!', 'What do you think?', 'Your turn!'];
    for (;;) {
      const areas = ['lit', 'num'].filter(a => !stopped[a] && idx[a] < PRETEST[a].length);
      if (!areas.length) break;
      const area = areas[turn % areas.length]; turn++;
      let item = PRETEST[area][idx[area]++];
      if (item.ifPrevOk && !lastOk[area]) { if (idx[area] >= PRETEST[area].length) stopped[area] = true; continue; }
      const pair = item.any ? pick(item.any) : [item.skill, item.args];
      const q = Engine.make(pair[0], pair[1], null);
      setBubble(lines[asked % lines.length]);
      const res = await presentQuestion(main, q, { mode: 'pretest' });
      guard(tok);
      results[area].push({ t: item.t, ok: res.ok, skill: pair[0] });
      lastOk[area] = res.ok;
      miss[area] = res.ok ? 0 : miss[area] + 1;
      if (miss[area] >= 2) stopped[area] = true;       // two in a row: stop climbing in this area, move on
      asked++;
      paintTrail(Math.min(8, Math.ceil(asked / 2)));
      if (asked % 4 === 0 && asked < PRETEST_TOTAL) { const line = pick(ENCOURAGE); setBubble(line); Sfx.play('star'); await Voice.say(line, { mood: 'cheer' }); guard(tok); }
    }
    paintTrail(8);
    const lv = Engine.place(results);
    p.level.lit = lv.lit; p.level.num = lv.num; p.placed = true; p.stretch = { lit: 1, num: 1 }; p.recent = { lit: [], num: [] };
    p.pretest = results;
    save();
    Sfx.play('win'); confetti(30);
    main.innerHTML = '<div class="banner" style="margin-top:14px">Ready for adventure!</div><div style="width:min(60vw,240px);height:min(60vw,240px);margin:10px auto">' + Art.hybrid(HYB(p.sel), hybridLevel(p.hybrids[p.sel].stars)) + '</div>' +
      '<button class="btn sun" id="onward" style="min-height:100px">' + Art.icon('map') + ' Go</button>' + hearBtn();
    wireTop(main);
    setBubble('Wow!');
    Voice.say('Wow, you did it, ' + p.name + '! You are ready for adventure!', { mood: 'cheer' });
    $('#onward', main).addEventListener('click', () => { Sfx.play('tap'); Screens.map(); });
  });
};

    wireTop(main);
    Voice.say(L.intro);
    await waitClick(main, '#nx'); guard(tok);
    /* 2. the guide shows how it works */

/* ============================================================
   BOSS BATTLE (turn based): ATTACK question, BOSS ATTACK, BLOCK question
   ============================================================ */
const BATTLE = { base: 22, weak: 8, bossHit: 16, heal: 6, doubleChance: 0.3 };

Screens.battle = function (lessonId, hid) {
  const p = prof(), L = LESSON(lessonId), B = BOSSES[lessonId], H = HYB(hid);
  p.sel = hid; save();
  const hl = hybridLevel(p.hybrids[hid].stars);
  const naps = p.naps[lessonId] || 0, easy = Math.min(naps, 3);              // each nap makes the boss a little easier
  const bossMax = Math.round(100 * (1 - 0.12 * easy)), bossAtk = Math.round(BATTLE.bossHit * (1 - 0.1 * easy));
  const meMax = 60 + (hl - 1) * 6;
  const S = { me: meMax, boss: bossMax, round: 0 };
  const { el, tok } = newScreen(topbar(L.title) +
    '<div class="arena"><div class="fighter" id="me"><div class="fname">' + H.name + '</div><div class="hpbar" id="mehp"><i style="width:100%"></i></div><div class="fig" id="mefig">' + Art.hybrid(H, hl) + '</div></div>' +
    '<div class="fighter" id="bs"><div class="fname">' + B.name + '</div><div class="hpbar boss" id="bshp"><i style="width:100%"></i></div><div class="fig" id="bsfig">' + Art.boss(B.kind, B.color) + '</div></div></div>' +
    '<div id="panel" class="qwrap" style="margin-top:10px"></div>');
  const panel = $('#panel', el), meFig = $('#mefig', el), bsFig = $('#bsfig', el);
  const setHp = (which, hp, max) => { const bar = $(which === 'me' ? '#mehp' : '#bshp', el); bar.firstChild.style.width = clamp(hp / max * 100, 0, 100) + '%'; bar.classList.toggle('low', hp / max < 0.35); };
  const floatText = (side, text, color) => { const f = document.createElement('div'); f.className = 'float'; f.textContent = text; if (color) f.style.color = color; $(side === 'me' ? '#me' : '#bs', el).appendChild(f); setTimeout(() => f.remove(), 1200 * timeScale); };
  const anim = (node, cls, ms) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); setTimeout(() => node.classList.remove(cls), (ms || 800) * timeScale); };
  const burst = side => { const b = document.createElement('div'); b.className = 'burst'; b.innerHTML = Art.icon('star'); $(side === 'me' ? '#me' : '#bs', el).appendChild(b); setTimeout(() => b.remove(), 700 * timeScale); };
  const say = (t, mood) => Voice.say(t, { mood: mood || 'calm' });
  const banner = (t, extra) => '<div class="banner">' + t + (extra ? ' ' + extra : '') + '</div>';
  let freeRetry = H.power === 'retry';
  const getRetry = () => { if (freeRetry) { freeRetry = false; return true; } return false; };
  const keys = [];

  run(async () => {
    panel.innerHTML = banner(B.name + ' wants to play!') + '<div>' + hearBtn() + '</div>'; wireTop(panel);
    Sfx.play('whoosh');
    await say(B.name + ' wants to play! Let us go, ' + H.name + '!'); guard(tok);
    for (;;) {
      S.round++;
      const atkDom = S.round % 2 === 1 ? L.domain : other(L.domain), blkDom = other(atkDom);

      /* --- 1. ATTACK: pick a move, answer a question --- */
      panel.innerHTML = banner('Pick a move!') + '<div class="moves">' + MOVES.map(m => '<button class="btn ' + m.color + ' move" data-m="' + m.id + '">' + Art.icon(m.icon) + m.name + '</button>').join('') + '</div><div>' + hearBtn() + '</div>';
      wireTop(panel);
      Voice.say('Pick a move!');
      const move = await new Promise(r => $$('.move', panel).forEach(b => b.addEventListener('click', () => { Sfx.unlock(); Sfx.play('tap'); r(MOVES.find(m => m.id === b.dataset.m)); })));
      guard(tok);
      const q = Engine.battleQuestion(p, atkDom, lessonId, keys); keys.push(q.say + '|' + q.answer);
      const res = await presentQuestion(panel, q, { mode: 'practice', retries: 1, fb: 'short', removeOne: H.power === 'hint', getRetry: getRetry, banner: 'Attack!' });
      guard(tok);
      Engine.record(p, q, res.first);
      let dmg, note = '';
      if (res.ok) {
        let mult = 1 + 0.1 * (hl - 1);
        if (H.power === 'lit' && atkDom === 'lit') { mult *= 1.5; note = H.powerName + '!'; }
        else if (H.power === 'num' && atkDom === 'num') { mult *= 1.5; note = H.powerName + '!'; }
        else if (H.power === 'all') { mult *= 1.2; note = H.powerName + '!'; }
        dmg = Math.round(BATTLE.base * mult);
        if (H.power === 'double' && Math.random() < BATTLE.doubleChance) { dmg *= 2; note = 'Lucky double!'; }
      } else { dmg = BATTLE.weak; }
      panel.innerHTML = banner(res.ok ? (note || 'Hit!') : 'A little tap!') + '<div>' + hearBtn() + '</div>'; wireTop(panel);
      anim(meFig, move.id === 'spin' ? 'spinfx' : move.id === 'splash' ? 'jumpfx' : 'lunge-r', 700);
      Sfx.play('whoosh'); await sleep(380); guard(tok);
      if (res.ok) { Sfx.play('hit'); anim(bsFig, 'hit', 500); burst('bs'); } else { Sfx.play('bonk'); anim(meFig, 'stumble', 800); anim(bsFig, 'hit', 300); }
      S.boss = Math.max(0, S.boss - dmg); setHp('boss', S.boss, bossMax); floatText('bs', '-' + dmg);
      if (res.ok) say(note ? note : pick(['Boom!', 'Wow!', 'Nice hit!']), 'cheer'); else say('Almost! Next time!');
      await sleep(1100); guard(tok);
      if (S.boss <= 0) { bsFig.parentNode.classList.add('defeat'); Sfx.play('star'); await say(B.name + ' is all done! You win!', 'cheer'); guard(tok); break; }

      /* --- 2. BOSS ATTACK: clear, funny, announced aloud --- */
      const atk = pick(B.attacks);
      panel.innerHTML = banner(B.name + ' uses ' + atk + '!') + '<div>' + hearBtn() + '</div>'; wireTop(panel);
      anim(bsFig, 'lunge-l', 800);
      await say(B.name + ' uses ' + atk + '!'); guard(tok);

      /* --- 3. BLOCK: a correct answer halves the damage, never a full block --- */
      const q2 = Engine.battleQuestion(p, blkDom, lessonId, keys); keys.push(q2.say + '|' + q2.answer);
      const r2 = await presentQuestion(panel, q2, { mode: 'practice', retries: 0, fb: 'short', removeOne: H.power === 'hint', getRetry: getRetry, banner: 'Block it!' });
      guard(tok);
      Engine.record(p, q2, r2.first);
      let taken;
      if (r2.ok) { taken = Math.max(1, Math.round(bossAtk * (H.power === 'block' ? 0.3 : 0.5))); }
      else { taken = Math.round(bossAtk * 0.75); }
      panel.innerHTML = banner(r2.ok ? 'Blocked a bit!' : 'Boing! Just a little bump.') + '<div>' + hearBtn() + '</div>'; wireTop(panel);
      if (r2.ok) { const sh = document.createElement('div'); sh.className = 'shield'; $('#me', el).appendChild(sh); setTimeout(() => sh.remove(), 900 * timeScale); Sfx.play('block'); }
      else { Sfx.play('bonk'); }
      await sleep(250); guard(tok);
      anim(meFig, 'hit', 500);
      S.me = Math.max(0, S.me - taken); setHp('me', S.me, meMax); floatText('me', '-' + taken);
      await sleep(1000); guard(tok);
      if (S.me > 0 && H.power === 'heal') {
        S.me = Math.min(meMax, S.me + BATTLE.heal); setHp('me', S.me, meMax); floatText('me', '+' + BATTLE.heal, '#259446'); Sfx.play('heal'); await sleep(800); guard(tok);
      }
      if (S.me <= 0) {
        /* --- needs a nap: gentle, never a punishment --- */
        p.naps[lessonId] = naps + 1; save();
        meFig.parentNode.classList.add('nap');
        Sfx.play('nap');
        panel.innerHTML = banner(H.name + ' needs a little nap. Zzz...') +
          '<div class="row2" style="justify-content:center;margin-top:10px">' + hearBtn() + '<button class="btn sun" id="again" style="min-height:100px">' + Art.icon('arrow', '#1b2a4e') + ' Again</button><button class="btn plain" id="tomap">' + Art.icon('map') + '</button></div>';
        wireTop(panel);
        Voice.say(H.name + ' needs a little nap. That is okay! The boss got a little easier. Let us try again!');
        bind(panel, '#again', () => Screens.battle(lessonId, hid));
        bind(panel, '#tomap', () => Screens.map());
        return;
      }
    }

    /* --- victory --- */
    const frac = S.me / meMax, stars = frac >= 0.7 ? 3 : frac >= 0.35 ? 2 : 1;
    Screens.rewards(lessonId, hid, stars);
  });
};

Screens.rewards = function (lessonId, hid, stars) {
  const p = prof(), B = BOSSES[lessonId], H = HYB(hid);
  const rec = p.lessons[lessonId] || (p.lessons[lessonId] = { done: true, stars: 0, won: false });
  const firstWin = !rec.won;
  const beforeLv = hybridLevel(p.hybrids[hid].stars);
  rec.won = true; rec.done = true; rec.stars = Math.max(rec.stars || 0, stars);
  p.hybrids[hid].stars += stars;
  const afterLv = hybridLevel(p.hybrids[hid].stars);
  let newSticker = false, newBuddy = null;
  if (!p.stickers.includes(lessonId)) { p.stickers.push(lessonId); newSticker = true; }
  if (firstWin && HYBRID_UNLOCK_AFTER.includes(lessonId)) {
    const locked = HYBRIDS.find(h => !p.hybrids[h.id].unlocked);
    if (locked) { p.hybrids[locked.id].unlocked = true; newBuddy = locked; }
  }
  save();
  const idx = BOSS_ROWS.findIndex(r => r[0] === lessonId);
  const { el, tok } = newScreen(topbar('') +
    '<div class="banner" style="margin:4px 0">You win!</div>' + starRow(stars) +
    '<div class="row2" style="justify-content:center;align-items:center;gap:18px;margin:8px 0">' +
    '<div style="width:clamp(110px,24vw,170px);height:clamp(110px,24vw,170px)">' + Art.hybrid(H, afterLv) + '</div>' +
    (newSticker ? '<div style="width:clamp(90px,20vw,140px);height:clamp(90px,20vw,140px);animation:pop .8s">' + Art.sticker(B.kind, B.color, STICKER_BG[idx % STICKER_BG.length]) + '</div>' : '') + '</div>' +
    (afterLv > beforeLv ? '<div class="banner" style="margin:4px 0">' + H.name + ' grew stronger!</div>' : '') +
    (newBuddy ? '<div class="row2" style="justify-content:center;align-items:center;gap:12px;margin:6px 0"><div class="banner">New buddy!</div><div style="width:clamp(90px,20vw,140px);height:clamp(90px,20vw,140px);animation:pop .8s">' + Art.hybrid(newBuddy, 1) + '</div></div>' : '') +
    '<div class="row2" style="justify-content:center;margin:12px 0">' + hearBtn() + '<button class="btn sun" id="done" style="min-height:100px">' + Art.icon('map') + ' Map</button></div>');
  Sfx.play('win'); confetti(60);
  Voice.say('You won! ' + stars + (stars === 1 ? ' star! ' : ' stars! ') + (newSticker ? 'You got a new sticker! ' : '') + (newBuddy ? 'And a new buddy, ' + newBuddy.name + '!' : ''), { mood: 'cheer' });
  bind(el, '#done', () => Screens.map());
};
/* ============================================================
   SECTION 10: SCREENS (part 3) - sticker book, buddies, parent area, boot
   ============================================================ */
Screens.stickers = function () {
  const p = prof();
  const slots = BOSS_ROWS.map((r, i) => {
    const got = p.stickers.includes(r[0]);
    return '<div class="slot ' + (got ? 'got' : '') + '" data-id="' + r[0] + '">' + (got ? Art.sticker(BOSSES[r[0]].kind, BOSSES[r[0]].color, STICKER_BG[i % STICKER_BG.length]) : Art.icon('lock').replace('<svg class="art"', '<svg style="opacity:.35" class="art"')) + '</div>';
  }).join('');
  const { el } = newScreen(topbar('Stickers') + '<div class="stgrid">' + slots + '</div><div style="margin:14px 0">' + hearBtn() + '</div>');
  Voice.say('My sticker book! Win boss fights to collect stickers!');
  bind(el, '.slot.got', b => { Sfx.play('star'); Voice.say(BOSSES[b.dataset.id].name + '!'); b.style.animation = 'pop .5s'; setTimeout(() => b.style.animation = '', 600 * timeScale); });
};

Screens.buddies = function () {
  const p = prof();
  let sel = p.sel;
  const { el } = newScreen(topbar('Buddies') +
    '<div class="avatars" id="grid">' + HYBRIDS.map(h => {
      const u = p.hybrids[h.id].unlocked;
      return '<button class="avbtn" data-id="' + h.id + '" aria-label="' + (u ? h.name : 'locked') + '">' + (u ? Art.hybrid(h, hybridLevel(p.hybrids[h.id].stars)) : '<div style="width:60%;height:60%;margin:20% auto">' + Art.icon('lock') + '</div>') + '</button>';
    }).join('') + '</div>' +
    '<div class="panel" id="info" style="max-width:640px;text-align:center;margin:14px 0"></div><div>' + hearBtn() + '</div>');
  const show = speak => {
    const h = HYB(sel), hs = p.hybrids[sel];
    $$('.avbtn', el).forEach(b => b.classList.toggle('sel', b.dataset.id === sel));
    if (!hs.unlocked) { $('#info', el).innerHTML = '<div style="font-size:26px;font-weight:900">New buddy to find!</div>'; if (speak) Voice.say('Win boss fights to find a new buddy!'); return; }
    const lv = hybridLevel(hs.stars);
    let starsHtml = '<div class="starrow" style="gap:4px">'; for (let i = 0; i < Math.min(hs.stars, 12); i++) starsHtml += '<div style="width:26px;height:26px">' + Art.icon('star') + '</div>'; starsHtml += '</div>';
    $('#info', el).innerHTML = '<div style="font-size:clamp(22px,4vw,32px);font-weight:900">' + h.name + '</div><div class="power">' + h.powerName + '</div>' +
      '<div style="font-size:clamp(16px,2.8vw,22px);font-weight:700;margin:6px 0">' + h.powerText + '</div>' + starsHtml;
    if (speak) Voice.say(h.name + '! ' + h.line);
  };
  show(false);
  Voice.say('These are your beast buddies!');
  bind(el, '.avbtn', b => { sel = b.dataset.id; if (p.hybrids[sel].unlocked) { p.sel = sel; save(); } Sfx.play('star'); show(true); });
};

/* ---------- parent area (hold the corner for 3 seconds) ---------- */
Screens.parent = function (viewId) {
  const ps = Store.data.profiles;
  const p = ps.find(x => x.id === viewId) || prof() || ps[0] || null;
  const S = Store.settings;
  let body = '';
  if (!p) body = '<div class="panel"><h2>No profiles yet</h2><div>Create a child profile from the start screen.</div></div>';
  else {
    const doneCount = LESSONS.filter(l => Engine.isDone(p, l.id)).length, wonCount = LESSONS.filter(l => p.lessons[l.id] && p.lessons[l.id].won).length;
    const rows = Object.keys(CATS).map(c => {
      const s = p.stats[c], asked = s ? s.asked : 0, pct = asked ? Math.round(s.right / asked * 100) : 0;
      return '<div><div class="prow"><span>' + CATS[c] + '</span><span>' + (asked >= 3 ? pct + '% (' + asked + ' answered)' : (asked ? 'just started' : 'not started')) + '</span></div><div class="meter"><i style="width:' + (asked ? pct : 0) + '%"></i></div></div>';
    }).join('');
    const ranked = Object.keys(CATS).filter(c => p.stats[c] && p.stats[c].asked >= 3).sort((a, b) => p.stats[a].right / p.stats[a].asked - p.stats[b].right / p.stats[b].asked);
    const tips = (ranked.length ? ranked.slice(0, 2) : ['letters', 'counting']).map(c => '<li><b>' + CATS[c] + ':</b> ' + OFFLINE_TIPS[c] + '</li>').join('');
    body += (ps.length > 1 ? '<div class="panel"><h2>Child</h2><div class="row2">' + ps.map(x => '<button class="btn ' + (x.id === p.id ? '' : 'plain') + ' pv" data-id="' + x.id + '">' + escapeHtml(x.name) + '</button>').join('') + '</div></div>' : '') +
      '<div class="panel"><h2>' + escapeHtml(p.name) + '</h2><div class="prow"><span>Literacy level</span><span>' + p.level.lit + ' of 4</span></div><div class="prow"><span>Numeracy level</span><span>' + p.level.num + ' of 4</span></div>' +
      '<div class="prow"><span>Lessons completed</span><span>' + doneCount + ' of ' + LESSONS.length + '</span></div><div class="prow"><span>Boss battles won</span><span>' + wonCount + '</span></div>' +
      '<div class="prow"><span>Starting game finished</span><span>' + (p.placed ? 'Yes' : 'Not yet') + '</span></div></div>' +
      '<div class="panel"><h2>Skills</h2>' + rows + '</div>' +
      '<div class="panel"><h2>Try these offline</h2><ul style="margin:6px 0;padding-left:22px">' + tips + '</ul></div>';
  }
  body += '<div class="panel"><h2>Sound</h2>' +
    '<div class="row2" style="align-items:center"><button class="btn plain" id="mutebtn">Sound effects: ' + (S.muted ? 'Off' : 'On') + '</button><button class="btn plain" id="testv">Test voice</button></div>' +
    '<h3>Volume</h3><input type="range" id="vol" min="0" max="1" step="0.05" value="' + S.volume + '">' +
    '<h3>Voice speed (slower is on the left)</h3><input type="range" id="rate" min="0.5" max="1.1" step="0.05" value="' + S.rate + '">' +
    '<h3>Voice pitch</h3><input type="range" id="pitch" min="0.8" max="1.5" step="0.05" value="' + (S.pitch || 1.1) + '">' +
    '<h3>Voice</h3><select class="field" id="voicesel"><option value="">Automatic (best on this device)</option>' + Voice.voices.map(v => '<option value="' + escapeHtml(v.name) + '"' + (S.voiceName === v.name ? ' selected' : '') + '>' + escapeHtml(v.name) + ' (' + escapeHtml(v.lang) + ')</option>').join('') + '</select>' +
    '<div class="note" style="text-align:left">Natural-sounding voices are chosen first. Your device may offer more under its accessibility or speech settings.</div></div>';
  if (p) body += '<div class="panel"><h2>Progress</h2><div class="row2"><button class="btn plain" id="redo">Redo starting game</button><button class="btn coral" id="reset">Reset progress</button><button class="btn coral" id="del">Delete profile</button></div><div class="note" style="text-align:left;margin-top:8px">Reset and delete ask you to tap twice.</div></div>';
  const { el } = newScreen('<div class="inner"><div class="topbar"><button class="round" id="pback" aria-label="back">' + Art.icon('back') + '</button><div class="mid">For grown-ups</div><div style="width:64px"></div></div>' + body +
    '<div class="note">Everything is saved only on this device. Nothing is sent anywhere.</div><div style="height:30px"></div></div>', 'parent');
  Voice.cancel();
  $('#pback', el).addEventListener('click', () => Screens.profiles());
  bind(el, '.pv', b => Screens.parent(b.dataset.id));
  $('#mutebtn', el).addEventListener('click', () => { S.muted = !S.muted; save(); Screens.parent(p && p.id); });
  $('#testv', el).addEventListener('click', () => { Voice.init(); Voice.say('Hello! I am Pip. I will read every question to you.'); });
  $('#vol', el).addEventListener('input', e => { S.volume = parseFloat(e.target.value); save(); });
  $('#rate', el).addEventListener('input', e => { S.rate = parseFloat(e.target.value); save(); });
  $('#rate', el).addEventListener('change', () => { Voice.say('This is how slowly I will talk.'); });
  $('#pitch', el).addEventListener('input', e => { S.pitch = parseFloat(e.target.value); save(); });
  $('#pitch', el).addEventListener('change', () => { Voice.say('Hello! This is my voice.'); });
  $('#voicesel', el).addEventListener('change', e => { S.voiceName = e.target.value; save(); Voice.pickVoice(); Voice.say('Hello! I am Pip. I will read every question to you.'); });
  if (!p) return;
  const twoTap = (id, label, action) => {
    const b = $('#' + id, el); let armed = false, t = null;
    b.addEventListener('click', () => {
      if (!armed) { armed = true; b.textContent = 'Tap again to confirm'; t = setTimeout(() => { armed = false; b.textContent = label; }, 4000); return; }
      clearTimeout(t); action();
    });
  };
  $('#redo', el).addEventListener('click', () => { p.placed = false; save(); Store.data.activeId = p.id; save(); Screens.pretest(); });
  twoTap('reset', 'Reset progress', () => {
    const fresh = Engine.newProfile(p.name, p.avatar); fresh.id = p.id; const i = ps.findIndex(x => x.id === p.id); ps[i] = fresh; save(); Screens.parent(p.id);
  });
  twoTap('del', 'Delete profile', () => {
    Store.data.profiles = ps.filter(x => x.id !== p.id); if (Store.data.activeId === p.id) Store.data.activeId = null; save(); Screens.profiles();
  });
};

/* ---------- boot ---------- */
function boot() {
  Store.load();
  App.root = $('#app');
  Voice.init();
  document.addEventListener('pointerdown', () => Sfx.unlock(), { once: false, passive: true });
  /* hidden grown-up corner: hold for 3 seconds */
  const corner = $('#corner'); let timer = null;
  const start = e => { e.preventDefault(); corner.classList.add('holding'); clearTimeout(timer); timer = setTimeout(() => { corner.classList.remove('holding'); Screens.parent(); }, 3000 * timeScale); };
  const stop = () => { corner.classList.remove('holding'); clearTimeout(timer); };
  corner.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => corner.addEventListener(ev, stop));
  corner.addEventListener('contextmenu', e => e.preventDefault());
  Screens.start();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
